<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anush Concept: Opening A, Touch the Shell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Nunito:wght@400;700;800&family=Noto+Serif:ital,wght@0,500..900;1,500..900&family=Noto+Serif+Armenian:wght@500..900&family=Noto+Sans+Armenian:wght@400..800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
body{background:radial-gradient(120% 90% at 50% 38%,#fff7ea 0,#f6e2c6 62%,#ecc99d 100%)}
.stage{position:fixed;inset:0}
canvas{display:block;position:absolute;inset:0}
.word{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:min(40vw,56vh);color:#f0d6b3;white-space:nowrap;line-height:.8;pointer-events:none;user-select:none;text-shadow:0 2px 0 rgba(255,255,255,.7);transition:transform .8s var(--ease)}
.copy{position:absolute;left:max(16px,3vw);bottom:max(70px,9vh);max-width:min(520px,80vw);z-index:5;pointer-events:none}
.copy h1{font-size:clamp(34px,5.4vw,78px);line-height:.98}
.copy p{margin-top:14px;font-weight:700;font-size:clamp(14px,1.3vw,18px);opacity:.8}
.hint{position:absolute;right:max(16px,3vw);bottom:max(70px,9vh);z-index:5;display:flex;align-items:center;gap:12px;font-weight:800;font-size:13px;letter-spacing:.04em;max-width:230px;text-align:right;pointer-events:none}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:rgba(42,20,12,.18)}.ring .fg{stroke:var(--pom);stroke-linecap:round;stroke-dasharray:126;stroke-dashoffset:126}
.flood{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--apricot);z-index:10;transform:scale(0);pointer-events:none;transition:transform 1.05s cubic-bezier(.6,.02,.2,1)}
.next{position:fixed;inset:0;z-index:11;background:var(--apricot);color:#2a0f00;display:grid;align-content:center;padding:max(24px,6vw);opacity:0;pointer-events:none;transition:opacity .6s .15s}
body.filled .next{opacity:1;pointer-events:auto}
.next .k{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.next h2{font-size:clamp(44px,9vw,150px);line-height:.9;margin:14px 0 20px;color:#fff6e6}
.next p{max-width:480px;font-weight:700;font-size:clamp(15px,1.5vw,20px)}
.next .row{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.next .ghost{padding:15px 22px;border-radius:99px;border:2px solid #2a0f00;font-weight:800}
.dot{position:absolute;right:8vw;top:18vh;width:min(22vw,160px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 6%,#ffc07a 9%,#ff8a2b 55%,#c7520a);box-shadow:0 30px 60px -20px rgba(120,40,0,.7);transform:scale(.6) translateY(30px);opacity:0;transition:all .9s .45s var(--ease)}
body.filled .dot{transform:none;opacity:1}
.fallback{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:30px;font-weight:800}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="word display" id="word" aria-hidden="true"><i>Anush</i></div>
  <canvas id="c"></canvas>
  <div class="fallback" id="fb">WebGL is not available here. On a normal browser the bonbon is live.</div>
</div>
<div class="nav">
  <a class="logo" href="#">Anush</a>
  <div class="right"><span class="tag">Concept</span>
    <div class="lang"><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="hy">ՀԱՅ</button></div>
    <button class="bag" aria-label="Box">0</button></div>
</div>
<div class="copy"><h1 class="display" data-k="h1"></h1><p data-k="sub"></p></div>
<div class="hint"><span id="hintTxt" data-k="hint"></span><div class="ring"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="20"/><circle class="fg" id="fg" cx="23" cy="23" r="20"/></svg></div></div>
<div class="flood" id="flood"></div>
<section class="next">
  <div class="dot"></div>
  <div class="k" data-k="next_k"></div>
  <h2 class="display" data-k="next_h"></h2>
  <p data-k="next_p"></p>
  <div class="row"><button class="cta" style="background:#2a0f00" data-k="cta"></button><button class="ghost" id="replay" data-k="replay"></button></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lang.js"></script>
<script src="shared.js"></script>
<script>
initLang();
var fg = document.getElementById('fg'), flood = document.getElementById('flood');
var b;
try {
  b = new Bon.Bonbon(document.getElementById('c'), {
    couture: true, hold: true, filling: '#ff8a2b', anchor: { x: 0, y: 0.06, s: 1.09 },
    onBurst: function () {
      var c = b.screenCenter();
      flood.style.left = c.x + 'px'; flood.style.top = c.y + 'px';
      setTimeout(function () {
        var d = Math.hypot(Math.max(c.x, innerWidth - c.x), Math.max(c.y, innerHeight - c.y)) * 2 / 40 + 1;
        flood.style.transform = 'scale(' + d + ')';
      }, 450);
      setTimeout(function () { document.body.classList.add('filled'); }, 1250);
    }
  });
  addEventListener('resize', function () { b.resize(); });
  (function ring() { fg.style.strokeDashoffset = 126 * (1 - b.crack); requestAnimationFrame(ring); })();
  document.getElementById('replay').addEventListener('click', function () {
    document.body.classList.remove('filled'); flood.style.transform = 'scale(0)'; b.reset();
  });
  // a first touch so the shell is already alive at second zero
  setTimeout(function () { b.ripples.push({ d: new THREE.Vector3(0.35, 0.25, 0.9).normalize(), t0: b.t, a: 1.2 }); }, 500);
} catch (e) { document.getElementById('fb').style.display = 'grid'; console.error(e); }
</script>
<a class="back" href="index.html">← Brand board</a>
</body>
</html>
